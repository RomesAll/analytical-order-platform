services:
  redis:
    image: redis:7-alpine
    container_name: rd
    hostname: rd-host
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --port ${REDIS_PORT} --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - public
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis_commander:
    image: rediscommander/redis-commander:latest
    container_name: rd-commander
    hostname: rd-commander-host
    restart: unless-stopped
    ports:
      - "8082:8081"
    networks:
      - public
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOSTS=local:redis:${REDIS_PORT:-6379}:0:${REDIS_PASSWORD}
      - HTTP_USER=${HTTP_USER}
      - HTTP_PASSWORD=${HTTP_PASSWORD}

  mongodb:
    image: mongo:latest
    container_name: mgdb
    hostname: mgdb-host
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - public
    volumes:
      - mongodb_data:/data/db
      - ./mongodb/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
  mongo-express:
    image: mongo-express:latest
    container_name: mgexp
    hostname: mgexp-host
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
        ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME}
        ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}

        ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME}
        ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD}
        ME_CONFIG_MONGODB_SERVER: mongodb
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - public

  pg-primary:
    image: postgres:15-alpine
    container_name: pg-primary
    hostname: pg-primary-host
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REPLICATION_USER: ${REPLICATION_USER}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
      REPLICA1_SLOT: ${REPLICA1_SLOT}
      REPLICA2_SLOT: ${REPLICA2_SLOT}
    volumes:
      - pg_primary_data:/var/lib/postgresql/data
      - ./postgresql/master/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgresql/master/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgresql/master/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    networks:
      - public
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  pg-replica-01:
    image: postgres:15-alpine
    container_name: pg-replica-01
    hostname: pg-replica-host-01
    restart: unless-stopped
    depends_on:
      pg-primary:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REPLICATION_USER: ${REPLICATION_USER}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
      PRIMARY_HOST: pg-primary
      REPLICA_SLOT: ${REPLICA1_SLOT}
      REPLICA_NUM: 1
    volumes:
      - pg_replica_data_01:/var/lib/postgresql/data
      - ./postgresql/replica/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgresql/replica/replica_entrypoint.sh:/replica_entrypoint.sh:ro
    entrypoint: ['/replica_entrypoint.sh']
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    networks:
      - public
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  pg-replica-02:
    image: postgres:15-alpine
    container_name: pg-replica-02
    hostname: pg-replica-host-02
    restart: unless-stopped
    depends_on:
      pg-primary:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REPLICATION_USER: ${REPLICATION_USER}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
      PRIMARY_HOST: pg-primary
      REPLICA_SLOT: ${REPLICA2_SLOT}
      REPLICA_NUM: 2
    volumes:
      - pg_replica_data_02:/var/lib/postgresql/data
      - ./postgresql/replica/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgresql/replica/replica_entrypoint.sh:/replica_entrypoint.sh:ro
    entrypoint: ['/replica_entrypoint.sh']
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    networks:
      - public
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  public:
    driver: bridge
  private:
    driver: bridge
    internal: True

volumes:
  pg_primary_data:
  pg_replica_data_01:
  pg_replica_data_02:
  mongodb_data:
  redis_data: