# ============================================
# СЕТЬ
# ============================================
listen_addresses = '*'
port = 5432
max_connections = 50

# ============================================
# РЕПЛИКАЦИЯ
# ============================================
wal_level = replica
max_wal_senders = 20
max_replication_slots = 20
wal_keep_size = 1024MB

# ============================================
# ПРОИЗВОДИТЕЛЬНОСТЬ
# ============================================
# Асинхронная репликация (для тестов)
synchronous_commit = off
wal_sender_timeout = 60s

# ============================================
# ЛОГИРОВАНИЕ
# ============================================
log_connections = on
log_disconnections = on
log_checkpoints = on
log_replication_commands = on